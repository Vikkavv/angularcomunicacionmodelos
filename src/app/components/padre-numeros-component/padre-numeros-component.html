<h1>Padre números</h1>
<h2>La suma es: {{suma}}</h2>
<div class="flex gap1">
    <button class="btn" (click)="generarNumero()" >Generar número</button>
    <button class="btn" (click)="borrarUltimo()">Borrar último</button>
    <button class="btn" (click)="reestablecerSuma()">Reestablecer suma</button>
</div>
<br><br>
<div class="grid gap1 col-8">
    @for (num of numeros; track $index) {
        <app-hijo-numeros-component (sumarNumero)="sumarNumero($event)" [numero]="num" />
    }
</div>
